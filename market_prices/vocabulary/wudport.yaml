# WudPort's scope vocabulary (W4, Mas 13 Nov): its runs keep the sheet-material listings the owner's research covered,
# in the sellers' own words, per language of his sites' markets (owner-inputs/wudport-wood-sites-13nov.md).
# A listing is kept when its text holds a word of a category in its market's languages; text and words compare after
# match_key (case, accents and punctuation do not count) and a word may sit inside a compound. Matching a listing to a
# WudPort price group is the consumer's (689 B2), never this file's.
# An empty list is a stated gap: a seller's word not confirmed yet. The W6 site pilots check each against real listing
# titles before it is added.
brand: wudport
scope: words
languages_by_market:
  GB: [en]
  DE: [de]
  FR: [fr]
  NL: [nl]
  BE: [nl, fr]
  PL: [pl]
  SE: [sv]
categories:
