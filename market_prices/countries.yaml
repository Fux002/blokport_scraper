# The one brand-neutral country table a stated origin is read through (market_prices/specs.py, CONTRACT.md "Specs").
# Each ISO 3166 country: its alpha-2 and alpha-3 codes as ISO writes them, and the names sources state it by. Every
# entry comes from a source's evidence (first: the countries the owner's competitor tabs name, 14 Nov); a stated
# origin the table does not hold refuses its row until the country is added here, at the source. Codes are quoted:
# YAML reads a bare NO as false.
countries:
  - {iso2: "AL", iso3: "ALB", names: [Albania]}
  - {iso2: "AO", iso3: "AGO", names: [Angola]}
  - {iso2: "BE", iso3: "BEL", names: [Belgium]}
