# Per-source configuration (section 3.1, section 12).
# vendor = the COMPANY this source's products belong to (the marketplace seller). This is WHERE
#   YOU SET which scraper belongs to which company: it is sent as the `vendor` reference in the
#   Medusa sync, and Medusa resolves it to its company id (no Medusa ids live here). Several sources
#   may share one vendor. Blank -> the source name. (company_id below is the env-specific Medusa-id
#   owner; it is live in the ledger + sync payload, the Medusa upsert, the validate gate, and the CSV.)
# company_id and sales_channel_id own the products from a site. ports_default = the
# SUPPLIER's shipping ports BY NAME or UN/LOCODE (resolved against catalog_source/ports.csv,
# the master list of 601 ports); always applied, the product ships from the supplier.
# origin_default = ISO-2 country of the SUPPLIER, the origin fallback when the scrape
# has no country and origin_map doesn't cover the variety. Backend ids are dev-staging
# defaults; replace per source when real accounts exist. VERIFY each origin_default.
# min_expected_rows = catastrophic-scrape floor: a run below it aborts and never delists (guards a
# broken/empty/truncated fetch). Set well under the normal count (~recent ÷ 4), not a tight bound.
polonine:
  source_code: pol
  vendor: Polonine  # VERIFY: the company these products belong to
  ports_default:
    - Brindisi
    - Civitavecchia
  emit_on_review: true
  origin_default: IT  # VERIFY supplier country
  default_bundle_size: 6
  min_expected_rows: 75   # recent ~300
marenostone:
  source_code: mar
  vendor: Marenostone  # VERIFY: the company these products belong to
  ports_default:
    - Brindisi
  emit_on_review: true
  origin_default: IT  # VERIFY supplier country
  primary_origin: IR  # PRIMARY quarry origin: marenostone sources predominantly Iranian stone. Gates the
  #                     origin map -- a map origin that isn't IR for this vendor holds for confirmation.
  default_bundle_size: 6
  min_expected_rows: 60   # recent ~260
zucchi:
  source_code: zuc
  vendor: Zucchi  # VERIFY: the company these products belong to
  ports_default:
    - Brindisi
  emit_on_review: true
  origin_default: IT  # Zucchi = Italian stone company
  default_bundle_size: 6
  min_expected_rows: 500  # recent ~2000
varsha:
  source_code: var
  vendor: Varsha Stones  # VERIFY: the company these products belong to
  ports_default:
    - Brindisi
  emit_on_review: true
  origin_default: IN  # Varsha Stones, India
  default_bundle_size: 6
  min_expected_rows: 125  # recent ~510
  watermarked: true   # varshastones.slabware.com burns a visible watermark into its photos
  # Source-specific de-watermark instruction (FAL Kontext). Names varsha's OWN mark (pink 'Varsha Stones'
  # leaf + grey subtext); every watermarked source declares its own -- never shared.
  fal_prompt: "Remove the pink 'Varsha Stones' watermark logo and any overlaid brand text from the surface of the stone slab, seamlessly reconstructing the natural stone pattern underneath. Keep the stone colour, veining, the size/label card and everything else in the photo identical to the original."
fuleistone:
  source_code: ful
  vendor: Fuleistone  # VERIFY: the company these products belong to
  ports_default:
    - Xiamen
  emit_on_review: true
  origin_default: CN  # VERIFY supplier country
  default_bundle_size: 6
  min_expected_rows: 300  # Stone Slabs category ~1274
