# Product-domain pack: natural stone (the DEFAULT pack).
#
# Declares the domain vocabulary + defaults that used to be hardcoded in the pipeline stages, so the tool
# can be spun up for a different product type by adding a sibling pack (config/domains/<type>.yaml) and
# setting BLOKPORT_DOMAIN_PACK. Every value here reproduces the historical stone constant EXACTLY, so the
# stone output stays byte-identical (the golden-output test is the guard). No em dashes.
name: stone

# The attribute vocabulary this product type resolves against (was normalize.VOCAB_FIELDS /
# loaders.VOCAB_CATEGORIES). Order is the resolution order. `disambiguator` is the identity-defining
# attribute (drives the Key, never guessed); `leaf_attributes` are the ones that grow the backbone leaf
# (everything except the disambiguator). A different product type declares its own set here.
attributes: [type, color, finish, quality]
disambiguator: type
leaf_attributes: [color, finish, quality]

# The category model (was the CATEGORIES tuple in settings.py). Each category is one FORM of the product;
# every category-derived constant in the pipeline recomputes from this list. The Medusa pcat id is NOT here
# -- it is env-specific and resolved at runtime from the env's attributes.csv. base_image "" = real photo.
categories:
  - {name: slab,  plural: slabs,  label: Slabs,  backbone_filename: backbone_slabs.json,  shares_variety_vocab: true, fan_out: true, mirror_of: null, volume_per_kg: "0.0017",    pcat_env_var: null,
     base_image: "https://v3b.fal.media/files/b/0a9ef2cf/Mfbt9fWxn_4taQ9Pe-wvs_base_slab_3.jpg"}
  - {name: block, plural: blocks, label: Blocks, backbone_filename: backbone_blocks.json, shares_variety_vocab: true, fan_out: true, mirror_of: null, volume_per_kg: "0.0014348", pcat_env_var: null,
     base_image: "https://v3b.fal.media/files/b/0a9f301e/Vlbo_xk9vDJtYKhEbkxBZ_base_block.jpeg"}
  # tiles mirror slabs and use the block volume per kg
  - {name: tile,  plural: tiles,  label: Tiles,  backbone_filename: backbone_tiles.json,  shares_variety_vocab: true, fan_out: true, mirror_of: slab, volume_per_kg: "0.0014348", pcat_env_var: BLOKPORT_CAT_TILES_PCAT,
     base_image: "https://v3b.fal.media/files/b/0a9f30f3/jdmNyxqelKJM4DxFi4jyG_base_tiles.png"}

# Type words too generic to disambiguate a variety on their own (was adapters/tokens.py _AMBIGUOUS_TYPE_WORDS).
ambiguous_type_words: [crystal, quartz, agate, amethyst, coral]

# A sensible default allowed-finish set for a new variant; the human refines it (was stages/curate.py
# _DEFAULT_FINISHES). Order preserved.
default_finishes: [Polished, Honed, Leathered, Brushed, Flamed, Sandblasted, Sawn Cut, Raw]

# Generic fallback colour for a variety whose source supplies none, e.g. zucchi (was curate._FALLBACK_COLOR
# and the duplicate variety_color.FALLBACK_COLOR).
fallback_color: Natural

# Last-resort attribute defaults: filled (flagged) when a REQUIRED attribute never resolves, so the product
# ships for correction instead of dropping (was settings.LAST_RESORT_FINISH / LAST_RESORT_QUALITY). Per branch
# for finish -- an unlisted branch uses slab's; one value for quality. Block finish defaults separately below.
last_resort_finishes: {slab: Polished, tile: Honed}
last_resort_quality: A

# The standard finish for a raw/unfinished block, applied when a block source gives none (was the hardcoded
# 'Raw' in stages/normalize.py). Must exist in attributes.csv + the block backbone.
block_finish: Raw

# Synthetic dimension/weight ranges per format, in metres/tonnes, used only as a fallback when a real value
# is absent (was stages/derive.py _SLAB_RANGES / _BLOCK_RANGES / _TILE_RANGES). [lo, hi].
dimension_ranges:
  slab:  {weight: [0.225, 0.350], length: [1.5, 3.0], width: [0.02, 0.03], height: [1.5, 3.0]}
  block: {weight: [18.0, 23.0],  length: [1.5, 3.0], width: [1.5, 3.0],   height: [1.5, 3.0]}
  tile:  {weight: [0.005, 0.012], length: [0.3, 0.6], width: [0.01, 0.02], height: [0.3, 0.6]}

# Fallback dimensions in METRES, applied by the shared derive stage (stages/derive.derive_dimensions) ONLY
# when a real scraped value is missing / unparseable / ambiguous. Every fill is provenance-flagged
# (FlagCode.dimension_defaulted) -- never silent. A real parsed value ALWAYS wins; a parsed 0 is a data
# error and is left to be rejected, never defaulted. This is the single shared toolbox every scraper uses,
# so dimensions behave identically across sources -- add a category here, never per-adapter dimension logic.
# Values are data-derived: the most common real slab is ~3.3x2.0m, tiles are 60x60cm, and the modal /
# European-standard slab+tile depth is 2cm. width == the depth (thickness); length+height are the two faces.
# Resolution rule (in derive): a range "A to B" on a FACE dimension (length/height) resolves to its MAX
# ("cut smaller later"); a thickness that is a range or MULTI resolves to `thickness` here, because a
# 2-3cm slab is stocked as the 2cm standard, not the midpoint.
dimension_defaults:
  slab:  {length: 3.30, height: 2.00, thickness: 0.02}
  block: {length: 2.80, height: 1.50, thickness: 1.50}
  tile:  {length: 0.60, height: 0.60, thickness: 0.02}

# Finish -> surface phrase for the generated product description (was stages/derive.py _FINISH_PHRASE).
# Benefit-led but finish-true: each line describes what the finish actually is, so it sells without
# inventing a claim. This is the one honest place the description carries a sensory hook.
finish_phrases:
  polished: "a bright, mirror-like surface that reflects light and deepens the stone's colour"
  honed: "a smooth, understated matte finish that reads calm and contemporary"
  leathered: "a soft, tactile texture with a gentle low sheen"
  brushed: "a lightly textured, modern matte finish"
  flamed: "a rugged, slip-resistant surface made for outdoor use"
  split face: "a bold, three-dimensional natural cleft with real depth"
  sandblasted: "a fine, even matte texture"
  tumbled: "a softened, antique-worn character"
# Phrase when the finish has no specific entry (was the default in derive.derive_description).
finish_phrase_default: "a refined natural surface"
