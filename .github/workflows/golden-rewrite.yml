name: Golden rewrite

# Regenerates the run_source golden on a branch and hands it back as an artifact; it never commits. Owner order (9 Nov):
# no test runs on the Mac, so an INTENDED output change gets its new golden here. The author downloads the artifact,
# checks that only the expected digests moved, and commits it; the PR's CI then proves it green.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch whose run_source golden to regenerate"
        required: true
      dump:
        description: "Also dump the rows the golden digests (ledger tables, alias write-back, tree gaps) at ref AND at base"
        type: boolean
        default: false
      base:
        description: "With dump: the sha to dump the same rows at (the PR's merge-base with main)"
        required: false
        default: ""
      bases:
        description: "First regenerate both committed bases' Aliases (regen_base_aliases), so the golden is computed over them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r stone_pipeline/requirements.txt
      # A one-off data commit (P2-10 C4): the bases go back as an artifact, never committed here; the golden below is
      # then computed over them, so one dispatch hands back both files of the change.
      - name: Regenerate the committed bases' Aliases
        if: inputs.bases
        run: |
          python -m stone_pipeline.reference.regen_base_aliases
          git diff --stat -- from_medusa/development/variants_export_base.csv from_medusa/production/variants_export_base.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.bases
        with:
          name: committed-bases
          path: |
            from_medusa/development/variants_export_base.csv
            from_medusa/production/variants_export_base.csv
          if-no-files-found: error
      # The test fails by design after a rewrite, so the step passes only when the log shows the rewrite happened.
      - name: Rewrite the golden
        env:
          RUN_SOURCE_GOLDEN: rewrite
          DUMP: ${{ inputs.dump }}
        run: |
          plugin=""
          if [ "$DUMP" = "true" ]; then
            export RUN_SOURCE_GOLDEN_DUMP="$GITHUB_WORKSPACE/golden-dump/head" PYTHONPATH="$GITHUB_WORKSPACE/.github"
            plugin="-p golden_dump"
          fi
          rc=0; pytest -q $plugin stone_pipeline/tests/test_run_source_golden.py > /tmp/rewrite.log 2>&1 || rc=$?
          cat /tmp/rewrite.log
          grep -q "golden REWRITTEN" /tmp/rewrite.log || { echo "the golden was not rewritten (pytest exit $rc)"; exit 1; }
          git diff --stat -- stone_pipeline/tests/fixtures/run_source_golden.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-source-golden
          path: stone_pipeline/tests/fixtures/run_source_golden.json
          if-no-files-found: error
      # The same rows at the base sha, by the SAME plugin (.github/golden_dump.py wraps whatever _scenario the base
      # checkout has), so one artifact holds both sides: golden-dump/base and golden-dump/head.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: inputs.dump && inputs.base != ''
        with:
          ref: ${{ inputs.base }}
          path: base-checkout
      - name: Dump the same rows at the base sha
        if: inputs.dump && inputs.base != ''
        run: |
          pip install -r base-checkout/stone_pipeline/requirements.txt
          cd base-checkout
          RUN_SOURCE_GOLDEN_DUMP="$GITHUB_WORKSPACE/golden-dump/base" PYTHONPATH="$GITHUB_WORKSPACE/.github" \
            pytest -q -p golden_dump stone_pipeline/tests/test_run_source_golden.py > /tmp/base.log 2>&1 || true
          tail -5 /tmp/base.log
          test -d "$GITHUB_WORKSPACE/golden-dump/base" || { echo "the base run wrote no dump"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dump
        with:
          name: run-source-golden-dump
          path: golden-dump/
          if-no-files-found: error
