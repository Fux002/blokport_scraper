# BUILD-ONLY: the scraper `core` image of ONE commit, pushed to the shared ECR repo as :<sha> and nothing else, so a
# prod candidate can be built from a commit that is not main's head (a candidate branch) and its digest named in a
# promotion ask. It never deploys: no ECS update, no terraform, no task definition, and it NEVER pushes :core or any
# prod- tag (only the explicit "$REPO:$SHA" ref is pushed). A tag that already exists is refused, never rebuilt, as
# deploy/build_standardise_image.sh refuses one (the repository's tags are mutable, so a rebuild would replace an image
# a promotion may already name).
#
# Dispatched FROM main: AWS_DEPLOY_ROLE_ARN trusts refs/heads/main only, so a run on any other ref is refused before
# credentials are asked for. The input reaches a step only through env, never interpolated into a script.
name: Build candidate image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The full 40-character commit sha to build the core image from (pushed as :<sha> only)"
        required: true
        type: string

permissions:
  id-token: write   # OIDC
  contents: read

concurrency:
  group: build-candidate
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: blokport-scraper
  # The entrypoint smoke is deploy.yml's own import line, read from the BUILT commit, so the candidate passes exactly
  # the smoke its own code would pass on a main deploy, and the module list has one home.
  SMOKE_ANCHOR: '--entrypoint python "$REPO:core" -c "import '

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # -eo pipefail: a failed read fails the run, never a silent green
    steps:
      - name: Check the ref and the dispatching branch
        env:
          SHA: ${{ inputs.ref }}
          RUN_REF: ${{ github.ref }}
        run: |
          [[ "${SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::refused: ref must be 40 lowercase hex characters, got '${SHA:-}'"; exit 1; }
          [ "$RUN_REF" = refs/heads/main ] || { echo "::error::refused: dispatch from main (the deploy role trusts refs/heads/main), not $RUN_REF"; exit 1; }
          echo "building $SHA"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check the checkout is that commit
        env:
          SHA: ${{ inputs.ref }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          [ "$HEAD_SHA" = "$SHA" ] || { echo "::error::refused: checked out $HEAD_SHA, not $SHA"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # Only ImageNotFound means the tag is free: any other failure (access, throttling, network) must not read as
      # "absent", or a push would replace an existing image under the same tag.
      - name: Refuse a tag that already exists
        env:
          SHA: ${{ inputs.ref }}
        run: |
          if found=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$SHA" 2>&1); then
            echo "::error::refused: $ECR_REPOSITORY:$SHA already exists; a candidate image is never rebuilt"
            exit 1
          elif ! grep -q ImageNotFoundException <<<"$found"; then
            echo "::error::could not check whether $ECR_REPOSITORY:$SHA exists: $found"
            exit 1
          fi
          echo "$ECR_REPOSITORY:$SHA is free"

      - name: Build the core image and smoke-import its entrypoints
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ inputs.ref }}
        run: |
          REPO="$REGISTRY/$ECR_REPOSITORY"
          COUNT=$(grep -c -F -- "$SMOKE_ANCHOR" .github/workflows/deploy.yml || true)
          [ "$COUNT" = 1 ] || { echo "::error::refused: deploy.yml at $SHA has $COUNT smoke-import lines, not 1"; exit 1; }
          MODULES=$(grep -F -- "$SMOKE_ANCHOR" .github/workflows/deploy.yml | sed -n 's/.*-c "import \(.*\)"[[:space:]]*$/\1/p')
          [[ "$MODULES" =~ ^[A-Za-z0-9_.]+(,[[:space:]]*[A-Za-z0-9_.]+)*$ ]] || { echo "::error::refused: the smoke-import module list reads '$MODULES'"; exit 1; }
          docker build --target core -t "$REPO:$SHA" .
          docker run --rm --entrypoint python "$REPO:$SHA" -c "import $MODULES"
          echo "Entrypoint imports OK in $REPO:$SHA"

      # The one push: the explicit :<sha> ref. The image carries no other local tag, so nothing else can be pushed.
      - name: Push :<sha> and print its digest
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ inputs.ref }}
        run: |
          REPO="$REGISTRY/$ECR_REPOSITORY"
          PUSHED=$(docker push "$REPO:$SHA" | tee /dev/stderr | sed -n "s/^$SHA: digest: \(sha256:[0-9a-f]\{64\}\) size: [0-9]*$/\1/p")
          [ -n "$PUSHED" ] || { echo "::error::refused: docker push named no digest for $REPO:$SHA"; exit 1; }
          READ=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text)
          [ "$READ" = "$PUSHED" ] || { echo "::error::refused: ECR reads $READ for :$SHA, the push said $PUSHED"; exit 1; }
          echo "pushed $REPO:$SHA ($PUSHED)"
          echo "### $ECR_REPOSITORY:$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "digest \`$PUSHED\` (push and ECR read-back agree); :core and prod tags untouched" >> "$GITHUB_STEP_SUMMARY"
