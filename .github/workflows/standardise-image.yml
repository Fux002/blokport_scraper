# Builds the photo standardiser's image, on a push to its feature branch. It pushes ONLY the immutable
# :standardise-<sha> tag: never :core or :gpu, which dev's live service and enhancer run. Deploy.yml is not used for
# this because it always pushes :core.
name: Standardise image

on:
  push:
    branches: [feature/standardise-images]
    paths:
      - "Dockerfile"
      - "deploy/standardise_source.py"
      - "deploy/run_pipeline.sh"
      - "stone_pipeline/**"
      - ".github/workflows/standardise-image.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo docker image prune -af || true
          df -h /
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build, smoke-import and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          TAG="standardise-${GITHUB_SHA}"
          docker build --target standardise -t "$REPO:$TAG" .
          docker run --rm -e SCRAPER_ENV=development --entrypoint python "$REPO:$TAG" -c "import deploy.standardise_source, simple_lama_inpainting, diffusers; print('imports ok')"
          docker push "$REPO:$TAG"
          echo "Pushed $REPO:$TAG"
