name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r stone_pipeline/requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Certify sources (per-source trust gate)
        run: python -m stone_pipeline.certify all
