name: Deploy

# Build the scraper image and push it to the SHARED ECR repo (blokport-scraper).
# One image, two deployments: the dev + prod Fargate tasks both pull this repo.
# Pushes both ":core" (dev tracks this for fast iteration) and ":<git-sha>" (the
# immutable tag you PROMOTE to prod via `-var prod_image_tag=<sha>` - never point
# prod at the mutable :core, or a dev push would move prod too). Dev's task def
# references :core, so its next run picks up the new image with no re-register.
#
# Requires the repo secret AWS_DEPLOY_ROLE_ARN = the scraper stack's
# `deploy_role_arn` Terraform output.

# Gated on CI: this runs when the CI workflow on main COMPLETES, and every step is skipped unless CI
# succeeded, so a red suite can never build and roll an image. It builds MAIN'S HEAD, not the commit whose CI
# finished: merges in quick succession finish CI in any order, and a deploy of the commit that finished last used
# to put dev back on older code (2026-11-04). The head is built only once its own CI is green (else its CI's
# completion brings the deploy that builds it), so whichever deploy runs last builds the head. A manual dispatch
# builds ONLY the heavy images it asks for (imageproc, gpu) from the dispatched ref: never the core image, so it never
# re-pushes a :<sha> a merge deploy already pushed (a rebuild is a new digest, and the tag would move off the image dev
# ran: 2026-11-08, :89b3b34 re-pushed by the gpu dispatch) and never moves :core. One rule holds for every run: an
# existing :<sha> or :gpu-<sha> never moves. A merge deploy that finds its head's :<sha> already pushed (an older
# commit's CI finishing after the head's, or a CI re-run) points :core at that image instead of rebuilding it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_imageproc:
        description: "Also build + push the heavy imageproc image (CPU torch: the variant-texture stack, for local/CPU use)"
        type: boolean
        default: false
      build_gpu:
        description: "Also build + push the GPU image (CUDA torch) for the AWS Batch texture job"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC
  contents: read
  actions: read     # whether main's head has a green CI run

# One merge deploy at a time; GitHub keeps one pending run per group, which is safe because every merge deploy
# builds the same head. A dispatch has its own group, so the two never cancel each other.
concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  # Dev tracks the mutable :core tag and the service's task def points at :core, so a new :core push does
  # NOT change the task def -- ECS sees "no change" and never rolls the running task. The roll step below
  # forces a re-pull after a push, so a merge actually goes live (not just "image pushed to ECR").
  ECS_CLUSTER: blokport-dev-cluster
  ECS_SERVICE: blokport-scraper-svc-development

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        shell: bash   # -eo pipefail: a failed lookup fails the deploy, never a silent green
    steps:
      # What this run builds: on a dispatch, only the heavy images it asks for from the dispatched ref (core=false);
      # else main's head when its CI is green (core=true: the core image, :<sha> and :core).
      - name: Resolve the commit to build
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ github.sha }}
          BUILD_IMAGEPROC: ${{ inputs.build_imageproc }}
          BUILD_GPU: ${{ inputs.build_gpu }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$BUILD_IMAGEPROC" != "true" ] && [ "$BUILD_GPU" != "true" ]; then
              echo "::error::a dispatch builds only the heavy images: set build_imageproc and/or build_gpu"
              exit 1
            fi
            echo "sha=$DISPATCHED" >> "$GITHUB_OUTPUT"
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch: the requested heavy images of $DISPATCHED; the core image, :<sha> and :core are untouched"
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/$REPO_NAME/commits/main" --jq .sha)
          GREEN=$(gh api "repos/$REPO_NAME/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&branch=main&status=success" --jq .total_count)
          # inside `if`, a non-numeric answer would read as "no green CI yet": refuse it instead
          if ! [[ "$GREEN" =~ ^[0-9]+$ ]]; then
            echo "::error::unexpected green-CI count for $HEAD_SHA: '$GREEN'"
            exit 1
          fi
          if [ "$GREEN" -gt 0 ]; then
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "Building main's head $HEAD_SHA (its CI is green)"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "Main's head $HEAD_SHA has no green CI yet: its CI's completion brings the deploy that builds it"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}

      # No-op (green) until AWS_DEPLOY_ROLE_ARN is set - see DEPLOY.md.
      - name: Check deploy is configured
        id: gate
        run: echo "ready=${{ secrets.AWS_DEPLOY_ROLE_ARN != '' && steps.target.outputs.sha != '' }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # :<sha> is the tag prod is pinned to, so it is pushed once. A merge deploy of a head whose :<sha> is already in
      # ECR (an older commit's CI finished after the head's, or a CI re-run) reuses that image: no build, no push.
      # deploy/ecr_image_digest.sh is the one tag lookup: only BatchGetImage's ImageNotFound reads as absent, and any
      # other answer (another failure code, a denied call) fails the deploy instead.
      - name: Look up the head's :<sha> in ECR
        id: existing
        if: steps.gate.outputs.ready == 'true' && steps.target.outputs.core == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          DIGEST=$(bash deploy/ecr_image_digest.sh "$SHA")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ -n "$DIGEST" ]; then echo ":$SHA is already $DIGEST: reused, not rebuilt"; else echo ":$SHA is new"; fi

      # The import smoke: every entrypoint module the :core container runs (the two servers, produce, the photo
      # process the runner starts, the overnight photos press) must IMPORT inside the built image before it is pushed. A boot-time NameError
      # (a missing import in serve()) used to reach dev as a crash-looping task; now it fails the build.
      - name: Build image and smoke-import its entrypoints
        if: steps.gate.outputs.ready == 'true' && steps.target.outputs.core == 'true' && steps.existing.outputs.digest == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          docker build --target core -t "$REPO:core" -t "$REPO:$SHA" .
          docker run --rm --entrypoint python "$REPO:core" -c "import stone_pipeline.config.server, stone_pipeline.config.control.server, stone_pipeline.ledger.server, stone_pipeline.produce, stone_pipeline.catalog, stone_pipeline.prepare_variant_images, scrapers.run, deploy.fetch_inputs, deploy.upload_artifacts, stone_pipeline.io.medusa_inputs, stone_pipeline.io.deliverables, stone_pipeline.io.image_wipe, stone_pipeline.io.texture_job, stone_pipeline.photos.process, deploy.start_photos_run"
          echo "Entrypoint imports OK in $REPO:core"

      # Only the merge deploy of main's head builds the core image, so :<sha> (the tag prod is pinned to) and :core
      # (dev's image) are pushed together, from the one build dev then runs. When :<sha> already exists, :core is
      # pointed at that image by copying its manifest (BatchGetImage + PutImage): nothing is rebuilt or re-pushed. The
      # manifest is read in whatever media type it was stored as and written to a file byte for byte, and PutImage is
      # given the existing digest, so ECR refuses a manifest that does not hash to it: :core lands on that image or
      # does not move. A :core already on it is left alone (ECR refuses a PutImage that changes nothing).
      - name: Push image
        if: steps.gate.outputs.ready == 'true' && steps.target.outputs.core == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.target.outputs.sha }}
          EXISTING: ${{ steps.existing.outputs.digest }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          if [ -z "$EXISTING" ]; then
            docker push "$REPO:$SHA"
            docker push "$REPO:core"
            echo "Pushed $REPO:core and :$SHA"
            exit 0
          fi
          CORE_DIGEST=$(bash deploy/ecr_image_digest.sh core)   # an assignment, so a failed lookup stops the step
          if [ "$CORE_DIGEST" = "$EXISTING" ]; then
            echo "$REPO:core already names :$SHA ($EXISTING)"
            exit 0
          fi
          IMAGE=$(aws ecr batch-get-image --repository-name blokport-scraper --image-ids imageDigest="$EXISTING" \
            --accepted-media-types application/vnd.docker.distribution.manifest.v2+json \
              application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.list.v2+json \
              application/vnd.oci.image.index.v1+json --output json)
          ONE_IMAGE='if (.images | length) == 1 then .images[0] else error("no single image for the digest") end'
          MANIFEST_FILE="$RUNNER_TEMP/core-manifest.json"
          jq -e -j "$ONE_IMAGE | .imageManifest" <<< "$IMAGE" > "$MANIFEST_FILE"
          MEDIA=$(jq -e -r "$ONE_IMAGE | .imageManifestMediaType" <<< "$IMAGE")
          aws ecr put-image --repository-name blokport-scraper --image-tag core --image-digest "$EXISTING" \
            --image-manifest "file://$MANIFEST_FILE" --image-manifest-media-type "$MEDIA" > /dev/null
          echo "Pointed $REPO:core at the existing :$SHA ($EXISTING); nothing rebuilt or re-pushed"

      # The mutable-tag gotcha: pushing a new :core does not change the task def, so ECS never rolls the
      # running service on its own -- the new image would sit in ECR, never live. Force a new deployment so
      # it re-pulls :core, and WAIT for stable so a green Deploy means the task ACTUALLY rolled, not just
      # that the image was pushed. Only on the CI-gated main run (the dev deploy); a manual imageproc/gpu
      # dispatch must not roll the app service. Prod is a separate task, promoted explicitly.
      - name: Roll dev service (re-pull :core) and wait for stable
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'workflow_run' && steps.target.outputs.core == 'true'
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null
          echo "Forced new deployment on $ECS_SERVICE; waiting for it to stabilize..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE"
          echo "Dev service is stable on the new :core"

      # Both heavy images bake the CUDA/torch stack + ~7 GB of pinned models, which
      # overflows the runner's ~14 GB default disk. Free ~25 GB before EITHER build.
      - name: Free disk space (heavy images)
        if: steps.gate.outputs.ready == 'true' && (inputs.build_imageproc || inputs.build_gpu)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          df -h /

      # Heavy CPU-torch variant (~10 GB with baked models); only on manual dispatch with the flag set. Smoke-imported
      # like core before its push: the texture job's entrypoint, the generator stack it needs (GEN_DEPS) and ben2.
      - name: Build and push imageproc image
        if: steps.gate.outputs.ready == 'true' && inputs.build_imageproc
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          docker build --target imageproc -t "$REPO:imageproc" .
          docker run --rm --entrypoint python "$REPO:imageproc" -c "import stone_pipeline.prepare_variant_images, fal_client, torch, ben2"
          docker push "$REPO:imageproc"
          echo "Pushed $REPO:imageproc"

      # imageproc (~17 GB) fills the runner disk, so a following gpu build in the SAME job runs out of
      # space while baking its models ("No space left on device"). imageproc is already in ECR by now, so
      # prune it + the build cache to reclaim room before gpu. Only when both are built in one dispatch.
      - name: Reclaim disk after imageproc (before gpu)
        if: steps.gate.outputs.ready == 'true' && inputs.build_imageproc && inputs.build_gpu
        run: |
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          df -h /

      # GPU image for the AWS Batch texture job; :gpu = dev (mutable), :gpu-<sha> = promote to prod. :gpu-<sha> is
      # pushed once: a second dispatch of the same commit fails before building instead of moving the tag prod may be
      # pinned to (deploy/ecr_image_digest.sh, the one tag lookup). Smoke-imported before its push: the job's
      # entrypoint (RUN_MODE=generate-textures), GEN_DEPS and ben2 (rb_images, the background-removal step).
      - name: Build and push gpu image
        if: steps.gate.outputs.ready == 'true' && inputs.build_gpu
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          EXISTING=$(bash deploy/ecr_image_digest.sh "gpu-$SHA")
          if [ -n "$EXISTING" ]; then
            echo "::error::$REPO:gpu-$SHA already exists ($EXISTING): an immutable tag is never re-pushed"
            exit 1
          fi
          docker build --target gpu -t "$REPO:gpu" -t "$REPO:gpu-$SHA" .
          docker run --rm --entrypoint python "$REPO:gpu" -c "import stone_pipeline.prepare_variant_images, fal_client, torch, ben2"
          docker push "$REPO:gpu"
          docker push "$REPO:gpu-$SHA"
          echo "Pushed $REPO:gpu and :gpu-$SHA"
