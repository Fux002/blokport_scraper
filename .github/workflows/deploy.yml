name: Deploy

# Build the scraper image and push it to its single ECR repo (blokport-scraper).
# There is ONE deployment; which environment a RUN targets (dev/prod staging
# bucket) is chosen at run time via BLOKPORT_ENV, not at build time. The Fargate
# task definition references the ":core" tag, so the next run picks up the new
# image automatically — no task-def re-registration needed.
#
# Requires the repo secret AWS_DEPLOY_ROLE_ARN = the scraper stack's
# `deploy_role_arn` Terraform output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No-op (green) until AWS_DEPLOY_ROLE_ARN is set — see DEPLOY.md.
      - name: Check deploy is configured
        id: gate
        run: echo "ready=${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.gate.outputs.ready == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          REPO="$REGISTRY/blokport-scraper"
          docker build --target core -t "$REPO:core" -t "$REPO:$SHA" .
          docker push "$REPO:core"
          docker push "$REPO:$SHA"
          echo "Pushed $REPO:core and :$SHA"
